# mise — single source of truth for the CLI tools this repo needs.
#
#   mise install         # install everything below
#   mise ls              # what's active
#   mise run pre-commit  # see [tasks] at the bottom
#
# Two toolchains live here (see CLAUDE.md): Terraform (via Terragrunt) in
# accounts/abotyan001/us-east-1/ — this is what actually manages the live
# cluster — and the CLI tools for the sibling `../argo-k8s-helm` repo, a
# parked ArgoCD/GitOps experiment that isn't in use. Both sets are listed.

[tools]
# --- Terraform side --------------------------------------------------------
# versions.tf pins `required_version >= 1.3.2`; this is what's used day to day.
terraform      = "1.15"
# pre-commit hook `terraform_tflint` + each module's own .tflint.hcl
# (modules/eks-cluster, modules/eks-workloads, modules/identity-center)
tflint         = "0.64"
# pre-commit hook `terraform_docs`; regenerates each module's README.md
# between the BEGIN_TF_DOCS/END_TF_DOCS markers (.terraform-docs.yml)
terraform-docs = "0.24"
# pre-commit hook `terragrunt-hcl-fmt` (gruntwork-io/pre-commit)
terragrunt     = "1.0"
# local pre-commit hooks `trivyfs`/`trivyconfig` in .pre-commit-config.yaml call this
# binary directly — no Docker daemon needed (unlike mxab/pre-commit-trivy's own hooks,
# which only ship "-docker" variants).
trivy          = "0.74.0"
# local pre-commit hook `gitleaks` in .pre-commit-config.yaml calls this binary
# directly, same reasoning as trivy above — the official gitleaks/gitleaks
# pre-commit hook needs `language: golang` (builds from source on every fresh
# pre-commit env instead of using one pinned, cached binary).
gitleaks       = "8.24.2"

# --- GitOps side (../argo-k8s-helm — parked experiment, not in use) -------
# `helm template` / `helm search repo` sanity checks against that repo's gitops/.
# (Terraform's helm provider pulls charts on its own here, but the CLI is used
# for local rendering and version lookups.)
helm      = "4.2"
# `aws eks update-kubeconfig` (make update-context), kubectl port-forward,
# general cluster debugging.
kubectl   = "1.34"
# `kustomize build` sanity checks for ../argo-k8s-helm's gitops/apps/* overlays.
kustomize = "5.7"

# --- Shared -------------------------------------------------------------------
# AWS auth for every terraform command (every provider.tf reads ~/.aws/*, profile
# set per-layer - "terraform" for 01-identity-center, "<account-name>.devops-admin"
# for eks-cluster/eks-workloads) and for `aws eks update-kubeconfig`.
awscli     = "2"
# `make aws-sso-configure-populate` (aws-sso-util configure populate) —
# generates ~/.aws/config SSO profile blocks for every permission set/account
# pair from modules/identity-center's live state, instead of hand-writing each
# `<account-name>.<role-name>` profile (see CLAUDE.md).
"pipx:aws-sso-util" = "latest"
# Hook runner for .pre-commit-config.yaml (`make pre-commit`).
pre-commit = "4"
# Runtime for pre-commit itself and its Python-based hooks
# (conventional-pre-commit, pre-commit-hooks).
python     = "3.12"
# Required by mise's pipx backend, used below for aws-sso-util/checkov.
pipx       = "latest"
# local pre-commit hook `checkov` in .pre-commit-config.yaml calls this binary
# directly, same "no rebuild every commit" reasoning as trivy/gitleaks above -
# the official bridgecrewio/checkov pre-commit hook builds its own venv fresh
# on the first run in any environment without one cached.
"pipx:checkov" = "latest"

# Not managed here on purpose:
#  - node / semantic-release      -> CI only (.github/workflows/release.yaml)
#  - the S3 state backend         -> auto-created by Terragrunt itself (--backend-bootstrap in the
#                                    Makefile), not a terraform resource — see root.hcl

[env]
# Keeps `terraform`/`aws` from needing -chdir juggling if you cd around; the
# Makefile already passes -chdir explicitly, this is just for ad-hoc use.
TF_VAR_FILE = "eks-cluster.tfvars"

[tasks.pre-commit]
description = "Run all pre-commit hooks"
run = "pre-commit run --all-files"

[tasks.context]
description = "Point kubeconfig at the eks-cluster layer's cluster"
run = "aws eks update-kubeconfig --name dev-me-k8s-cluster --region us-east-1 --profile terraform"

[tasks.docs]
description = "Regenerate modules/eks-cluster/README.md"
run = "terraform-docs markdown table --config=.terraform-docs.yml --output-file README.md --output-mode inject modules/eks-cluster"

[tasks.validate]
description = "fmt check + validate + tflint on the eks-cluster module"
dir = "{{ config_root }}/modules/eks-cluster"
run = [
  "terraform fmt -check -recursive",
  "terraform validate",
  "tflint --call-module-type=all --config=.tflint.hcl",
]

[tasks.docs-eks-workloads]
description = "Regenerate modules/eks-workloads/README.md"
run = "terraform-docs markdown table --config=.terraform-docs.yml --output-file README.md --output-mode inject modules/eks-workloads"

[tasks.validate-eks-workloads]
description = "fmt check + validate + tflint on the eks-workloads module"
dir = "{{ config_root }}/modules/eks-workloads"
run = [
  "terraform fmt -check -recursive",
  "terraform validate",
  "tflint --call-module-type=all --config=.tflint.hcl",
]
