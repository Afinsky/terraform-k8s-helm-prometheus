controller:
  # TLS is terminated at the NLB (ACM cert, see ingress-nginx.tf), so nginx receives
  # plaintext on its "http" port even for requests that arrived over https.
  # Without this, nginx can't tell the two apart and 308-redirects https
  # traffic back to https, looping.
  #
  # http->https redirect is done at the NLB-listener level instead (nginx can't
  # see the original scheme): the NLB :80 listener targets nginx port 2443, whose
  # only job is the 308 below; the NLB :443 listener targets the plaintext "http"
  # port. See service.targetPorts. This is the ingress-nginx documented pattern
  # for "TLS termination in AWS NLB".
  config:
    ssl-redirect: "false"
    http-snippet: |
      server {
        listen 2443;
        return 308 https://$host$request_uri;
      }
  replicaCount: 2
  minAvailable: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: true
    annotations: {}
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
     scaleDown:
       stabilizationWindowSeconds: 60
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  service:
    annotations:
      # "external" + nlb-target-type "ip" hands this Service to the AWS Load
      # Balancer Controller (load-balancer-controller.tf) instead of the legacy in-tree cloud
      # provider, and makes the NLB target pod IPs directly rather than
      # NodePort -> kube-proxy -> pod. Direct-to-pod also preserves the real
      # client source IP, so no PROXY protocol is needed.
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: 'true'
      service.beta.kubernetes.io/aws-load-balancer-ssl-ports: https
      service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: 'ELBSecurityPolicy-TLS13-1-2-2021-06'
    # NLB :80  -> nginx :2443 (http-snippet above) = unconditional 308 to https
    # NLB :443 -> nginx "http" port                = plaintext app traffic
    #                                                (TLS already terminated on the NLB)
    # 2443 is a bare numeric targetPort on purpose: a *named* targetPort would
    # need a matching containerPort on the controller pod, which the chart does
    # not declare for this listener.
    targetPorts:
      http: 2443
      https: http
