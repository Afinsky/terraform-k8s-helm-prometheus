apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1 #${region}
      # Cross-account: the secret lives in the management account, not this
      # one. ESO first authenticates as the ServiceAccount's IRSA role
      # (auth.jwt below), then assumes this role there - same shape as
      # external-dns's --aws-assume-role. See
      # modules/identity-center/secrets.tf and
      # modules/eks-workloads/external-secrets.tf.
      role: ${role_arn}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
