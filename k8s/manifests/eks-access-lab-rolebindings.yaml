# PLAT-101 lab, Phase 3: RBAC RoleBindings pairing with the SSO access
# entries in environments/eks-cluster/eks-access-lab.tf (their
# kubernetes_groups -> the Group subjects here). Requires the namespaces
# in eks-access-lab-namespaces.yaml to already exist.

# alice: view only in payments-prod, no Secrets - the built-in "view"
# ClusterRole excludes them, unlike the AmazonEKSEditPolicy access policy
# she has scoped to payments-dev (see eks-access-lab.tf).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payments-devs-view
  namespace: payments-prod
subjects:
  - kind: Group
    name: payments-devs
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
# bob: full edit rights in search-dev, entirely via RBAC - his access entry
# carries no AWS access policy at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: search-devs-edit
  namespace: search-dev
subjects:
  - kind: Group
    name: search-devs
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
