---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: photoapp-db-credentials
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: photoapp-db-credentials
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: username
      remoteRef:
        key: me-dev-us-east-1/photoapp/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: me-dev-us-east-1/photoapp/db-credentials
        property: password
