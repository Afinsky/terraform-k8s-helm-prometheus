apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoapp
spec:
  selector:
    matchLabels:
      app: photoapp
  replicas: 3
  template:
    metadata:
      labels:
        app: photoapp
    spec:
      # Pod-level counterpart to the container securityContext below - same
      # KSV-0118 finding is raised separately for pod vs. container scope.
      securityContext:
        runAsNonRoot: true
      containers:
      - image: ravindrasingh6969/nodeapp:latest
        name: photoapp
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            # Populated by external-secrets.tf's ExternalSecret below, not
            # hand-created - see kind: ExternalSecret further down this file.
            name: photoapp-db-credentials
        # Closes trivy findings KSV-0014/KSV-0118 (default security context).
        # readOnlyRootFilesystem forces this image's own writes (if any -
        # npm/node tmp files, upload buffers) onto the /tmp emptyDir below
        # instead of the container's root FS - if this image turns out to
        # write somewhere else, that path needs its own emptyDir mount too
        # (check for CrashLoopBackOff/permission-denied in logs after apply).
        # runAsNonRoot assumes the image doesn't hard-require root - if the
        # pod fails to start with a permission error, that assumption was
        # wrong and this line needs a matching runAsUser instead of just
        # runAsNonRoot: true.
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: photoapp
spec:
  ports:
  - port: 80 #service port
    targetPort: 8080 #container port
    protocol: TCP
  type: ClusterIP
  selector:
    app: photoapp
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: photoapp
  # No alb.ingress.kubernetes.io/* annotations here: this Ingress uses
  # ingressClassName "nginx", so it's reconciled by ingress-nginx, not the AWS
  # Load Balancer Controller. TLS termination and the ACM cert live on the
  # NLB in front of ingress-nginx (ingress-nginx.yaml / ingress-nginx.tf), not on this object.
spec:
  ingressClassName: nginx
  rules:
    - host: myapp.abotyan.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: photoapp
                port:
                  number: 80
          - path: /ping
            pathType: Prefix
            backend:
              service:
                name: photoapp
                port:
                  number: 80
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: photoapp
                port:
                  number: 80
          - path: /error
            pathType: Prefix
            backend:
              service:
                name: photoapp
                port:
                  number: 80

#    - host: ourapp.abotyan.click
#      http:
#        paths:
#          - path: /
#            pathType: Prefix
#            backend:
#              service:
#                name: photoapp
#                port:
#                  number: 80
#          - path: /ping
