# RBAC boundary for workloads. Deliberately narrower than `platform`: no
# cluster-scoped resources, one repo, namespaces limited to what
# apps-appset.yaml actually creates (one per app directory).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Business workloads (photoapp, online-boutique) — no cluster-scoped resources.
  sourceRepos:
    - https://github.com/Afinsky/terraform-k8s-helm-prometheus.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: photoapp
    - server: https://kubernetes.default.svc
      namespace: online-boutique
  clusterResourceWhitelist: []
