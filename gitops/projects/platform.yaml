# RBAC boundary for cluster add-ons. Wider than `apps` on purpose: these
# components legitimately need cluster-scoped resources (ClusterRole,
# IngressClass, CRDs) and upstream Helm repos, not just this git repo.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster add-ons (ingress, DNS, secrets, load balancing) — infra-team owned.
  sourceRepos:
    - https://github.com/Afinsky/terraform-k8s-helm-prometheus.git
    - https://aws.github.io/eks-charts
    - https://kubernetes.github.io/ingress-nginx
    - https://kubernetes-sigs.github.io/external-dns/
    - https://charts.external-secrets.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
