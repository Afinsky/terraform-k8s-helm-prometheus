# Static values, identical across every environment this chart is ever
# deployed into. Environment-specific values (right now: just the ACM cert
# ARN) live in values-develop.yaml — see that file's header for why.
controller:
  # TLS terminates at the NLB (ACM cert, see values-develop.yaml), so nginx
  # receives plaintext on its "http" port even for requests that arrived
  # over https. Without this, nginx can't tell the two apart and
  # 308-redirects https traffic back to https, looping.
  config:
    ssl-redirect: "false"
  replicaCount: 2
  minAvailable: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: true
    annotations: {}
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 60
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  service:
    annotations:
      # "external" + nlb-target-type "ip" hands this Service to the AWS
      # Load Balancer Controller instead of the legacy in-tree cloud
      # provider, and makes the NLB target pod IPs directly rather than
      # NodePort -> kube-proxy -> pod. Direct-to-pod also preserves the
      # real client source IP, so no PROXY protocol is needed.
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      service.beta.kubernetes.io/aws-load-balancer-ssl-ports: https
      service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
    targetPorts:
      http: http
      https: http
