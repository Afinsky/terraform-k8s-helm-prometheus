# The one deliberate exception to "no Terraform-computed values in
# gitops/": the ACM certificate ARN. It's genuinely dynamic (AWS assigns
# the ID when acm.tf's certificate is created) and there's no
# ServiceAccount-style bridge for a Service annotation the way there is
# for IRSA role ARNs, and no cert auto-discovery for a plain Service-type
# NLB (that AWS Load Balancer Controller feature only covers ALB Ingress).
#
# Paste it once after the first `terraform apply`:
#   terraform output -raw acm_certificate_arn
# Stable afterwards unless acm.tf's aws_acm_certificate is replaced.
controller:
  service:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/REPLACE_AFTER_FIRST_APPLY"
