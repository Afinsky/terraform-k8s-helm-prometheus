# Cluster-scoped (vs. namespaced SecretStore) so any namespace's
# ExternalSecret can reference it by name — every app in gitops/apps/ does.
# region is a plain literal: us-east-1 is fixed by develop.tfvars and
# doesn't vary per namespace, so there's nothing for Terraform to compute
# here.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    # Ordered after the chart's CRDs + webhook (this Application's other two
    # sources, default wave "0") — see application.yaml's header comment.
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
