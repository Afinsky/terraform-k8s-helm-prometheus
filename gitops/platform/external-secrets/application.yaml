# The one platform component NOT picked up by
# clusters/develop/platform-appset.yaml's generator - there's deliberately
# no generator.yaml in this directory. Reason: this Application needs three
# sources (chart, values, and the ClusterSecretStore manifest below), and
# the ApplicationSet's template is shared by every other component, so it
# can only express the common two-source shape. Applied directly instead by
# gitops/bootstrap/root.yaml (see its `directory.include` comment).
#
# ServiceAccount + IRSA role come from Terraform
# (kubernetes_service_account_v1.external_secrets in external-secrets.tf).
# All three sources land in one sync operation, so the ClusterSecretStore's
# resource-level sync-wave (see manifests/cluster-secret-store.yaml)
# reliably orders it after the chart's CRDs - within one Application,
# sync-wave works exactly as you'd expect; across separate Applications it
# doesn't (see platform-appset.yaml's retry comment).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-external-secrets
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.9.0 # controller app v2.9.0 — verified via `helm search repo external-secrets/external-secrets --versions`, re-check before bumping.
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/gitops/platform/external-secrets/values-base.yaml
    - repoURL: https://github.com/Afinsky/terraform-k8s-helm-prometheus.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Afinsky/terraform-k8s-helm-prometheus.git
      targetRevision: main
      path: gitops/platform/external-secrets/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
