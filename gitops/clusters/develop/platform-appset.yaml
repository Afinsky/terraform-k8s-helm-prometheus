# Unlike apps-appset.yaml, this can't use a `directories` generator: every
# platform add-on comes from a different upstream chart repo, so there's no
# single fixed source shape a `directories` generator could point at. The
# `files` generator instead globs for a small generator.yaml in each
# directory and feeds its parsed keys straight into the template - drop a
# generator.yaml with the four keys below into a new platform/<name>/
# directory (alongside values-base.yaml / values-develop.yaml) and it's
# onboarded, no edits here.
#
# A directory with no generator.yaml (external-secrets/) is invisible to
# this generator on purpose - see that Application's header comment for why
# it's hand-authored instead.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-develop
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/Afinsky/terraform-k8s-helm-prometheus.git
        revision: main
        files:
          - path: "gitops/platform/*/generator.yaml"
  template:
    metadata:
      name: "platform-{{.path.basename}}"
    spec:
      project: platform
      sources:
        - repoURL: "{{.chartRepoURL}}"
          chart: "{{.chartName}}"
          targetRevision: "{{.chartVersion}}"
          helm:
            releaseName: "{{.path.basename}}"
            valueFiles:
              - $values/{{.path.path}}/values-base.yaml
              - $values/{{.path.path}}/values-develop.yaml
        - repoURL: https://github.com/Afinsky/terraform-k8s-helm-prometheus.git
          targetRevision: main
          ref: values # <- alias for the source above, so values-base.yaml / values-develop.yaml are included to the chart above from the git repo. See https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#using-values-from-a-git-repository
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        # Ordering across these (LB Controller's webhook before
        # ingress-nginx/external-dns need it) is retry/self-heal, not a
        # sync-wave - ApplicationSet-generated Applications are independent
        # top-level objects, not resources of one parent sync, so a
        # sync-wave annotation here wouldn't be evaluated by anything.
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
