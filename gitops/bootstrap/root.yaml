# The single hand-authored Application in this whole tree. Applied once by
# Terraform (kubernetes_manifest.argocd_root_app in argocd.tf) right after
# helm_release.argocd installs the controller itself. Everything else in
# gitops/ is reached by ArgoCD following this Application, never by
# Terraform or by `kubectl apply`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # AppProjects: platform-appset.yaml/apps-appset.yaml below reference
    # these by name (spec.project). If the ApplicationSet controller
    # generates a child Application before the AppProject exists, that one
    # child fails validation and retries on the next reconcile - same
    # eventual-consistency reasoning as everywhere else in this repo, not a
    # hard ordering guarantee.
    - repoURL: https://github.com/Afinsky/terraform-k8s-helm-prometheus.git
      targetRevision: main
      path: gitops/projects
    # external-secrets is the one platform component NOT covered by
    # platform-appset.yaml's generator (see that ApplicationSet's header
    # comment) - it needs a third source (the ClusterSecretStore manifest)
    # that a generic per-component template can't express, so it's applied
    # directly here instead. `directory.include` picks out just the
    # Application object; values-*.yaml in the same folder aren't valid
    # standalone manifests and must NOT be applied this way.
    - repoURL: https://github.com/Afinsky/terraform-k8s-helm-prometheus.git
      targetRevision: main
      path: gitops/platform/external-secrets
      directory:
        include: "application.yaml"
    # The two ApplicationSets that fan out everything else.
    - repoURL: https://github.com/Afinsky/terraform-k8s-helm-prometheus.git
      targetRevision: main
      path: gitops/clusters/develop
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      # No prune here on purpose - root's blast radius is the entire
      # cluster (delete a line in this file's sources, and everything that
      # source ever created disappears on the next sync). Every Application
      # below this one prunes automatically; this is the one deliberate
      # exception, so removing something at the top always needs an
      # explicit `argocd app sync root --prune` instead of happening
      # silently on the next reconcile.
    syncOptions:
      - CreateNamespace=true
