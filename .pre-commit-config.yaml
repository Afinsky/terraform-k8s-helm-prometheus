default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: terragrunt-hcl-fmt

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0 # Do not upgrade https://github.com/antonbabenko/pre-commit-terraform/issues/640#issuecomment-2367816858
    hooks:
      - id: terraform_validate
        args:
          - '--hook-config=--retry-once-with-cleanup=true'

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
      - id: terraform_docs
        args:
          - '--hook-config=--create-file-if-not-exist=true'
          - '--hook-config=--use-standard-markers=true'
          - '--args=--config=.terraform-docs.yml'
      - id: terraform_tflint
        exclude: ^accounts/abotyan001/us-east-1/develop/unused/
        args:
          - '--args=--call-module-type=all'
          # Full default ruleset (terraform_* core rules + the aws_* rules from the
          # tflint-ruleset-aws plugin declared in each layer's .tflint.hcl) — no --only
          # restriction. Previously limited to a 13-rule allowlist; dropped after
          # confirming the full ruleset finds nothing new to fix on this repo.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # mxab/pre-commit-trivy only ships "-docker" hook variants (language: docker_image), which
  # need the Docker daemon running for every commit. These call the `trivy` binary directly
  # instead (pinned via mise.toml) — same checks, no Docker dependency.
  #
  # --severity CRITICAL,HIGH only: a full scan of this repo turned up 108 findings, mostly
  # LOW/MEDIUM Kubernetes hardening nits (seccompProfile, non-default namespace, etc.) plus a
  # few HIGH/CRITICAL findings that are deliberate homelab tradeoffs (public EKS API endpoint
  # restricted to one IP, public subnets for cost). Blocking on the full set would leave every
  # commit permanently red. Run without --severity locally to see everything.

