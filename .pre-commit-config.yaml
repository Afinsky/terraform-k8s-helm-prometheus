default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: terragrunt-hcl-fmt

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0 # Do not upgrade https://github.com/antonbabenko/pre-commit-terraform/issues/640#issuecomment-2367816858
    hooks:
      - id: terraform_validate
        args:
          - '--hook-config=--retry-once-with-cleanup=true'

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
      - id: terraform_docs
        args:
          - '--hook-config=--create-file-if-not-exist=true'
          - '--hook-config=--use-standard-markers=true'
          - '--args=--config=.terraform-docs.yml'
      - id: terraform_tflint
        exclude: ^modules/eks-cluster/unused/
        args:
          - '--args=--call-module-type=all'
          - '--args=--only=terraform_deprecated_interpolation'
          - '--args=--only=terraform_deprecated_index'
          - '--args=--only=terraform_unused_declarations'
          - '--args=--only=terraform_comment_syntax'
          - '--args=--only=terraform_documented_outputs'
          - '--args=--only=terraform_documented_variables'
          - '--args=--only=terraform_typed_variables'
          - '--args=--only=terraform_module_pinned_source'
          - '--args=--only=terraform_naming_convention'
          - '--args=--only=terraform_required_version'
          - '--args=--only=terraform_required_providers'
          - '--args=--only=terraform_standard_module_structure'
          - '--args=--only=terraform_workspace_remote'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  # mxab/pre-commit-trivy only ships "-docker" hook variants (language: docker_image), which
  # need the Docker daemon running for every commit. The hooks below (currently disabled, see
  # the TODO) call the `trivy` binary directly instead (pinned via mise.toml) — same checks, no
  # Docker dependency.
  #
  # --severity CRITICAL,HIGH only: a full scan of this repo turned up 108 findings, mostly
  # LOW/MEDIUM Kubernetes hardening nits (seccompProfile, non-default namespace, etc.) plus a
  # few HIGH/CRITICAL findings that are deliberate homelab tradeoffs (public EKS API endpoint
  # restricted to one IP, public subnets for cost). Blocking on the full set would leave every
  # commit permanently red. Run without --severity locally to see everything.

