name: PR Checks

on:
  pull_request:

# No implicit write-all: this workflow only checks out and runs local
# read-only linters, nothing here calls the GitHub API.
permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (fmt, validate, tflint, docs, gitleaks, trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mise Action
        uses: jdx/mise-action@v2

      - name: Run make setup
        run: make setup

      - name: Run make lint
        run: make lint
