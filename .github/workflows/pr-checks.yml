name: PR Checks

# Runs the same checks `make lint` runs locally (fmt, terraform validate,
# tflint, terraform-docs, gitleaks, trivy, conventional-commit format) on
# every PR - see docs/setup_evaluation.md, item #1 ("no plan on PR" gap).
#
# Deliberately does NOT run `terragrunt plan` here: that needs real AWS
# credentials, which means granting this repo's GitHub Actions a new OIDC
# trust into the AWS Organization - a separate, explicit decision, not
# bundled into this workflow. `terraform_validate`/`terraform_tflint` below
# need no AWS access at all (pre-commit-terraform inits both with
# -backend=false - confirmed by running this exact hook set locally against
# a clean checkout with no .terraform/.terragrunt-cache and no AWS
# credentials in the environment).
on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (fmt, validate, tflint, docs, gitleaks, trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs every tool pinned in mise.toml (terraform, terragrunt,
      # tflint, terraform-docs, trivy, gitleaks, pre-commit, python) at the
      # exact versions used locally - no separate version pins to keep in
      # sync here.
      - name: Install mise-pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true

      # pre-commit-terraform's terraform_tflint hook runs one shared
      # `tflint --init` before checking each module directory - reliable on
      # a machine with a warm plugin cache (~/.tflint.d/plugins), but on a
      # cold CI runner it races the per-directory tflint invocations and
      # they fail with "Plugin \"aws\" not found" (reproduced live in this
      # workflow before adding this step). Installing the plugin for every
      # module up front, before pre-commit ever runs, sidesteps that race.
      - name: Pre-install tflint plugins
        run: |
          for d in modules/*/; do
            if [ -f "${d}.tflint.hcl" ]; then
              (cd "$d" && mise exec -- tflint --init)
            fi
          done

      - name: Run pre-commit
        run: mise exec -- pre-commit run --all-files
