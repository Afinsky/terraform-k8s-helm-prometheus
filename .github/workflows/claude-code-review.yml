name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request. Focus on correctness bugs, security issues
            (this repo provisions real AWS/IAM/EKS infrastructure via Terraform —
            pay particular attention to IAM trust policies, permission scoping,
            and cross-account role assumptions), and adherence to the conventions
            in CLAUDE.md. Skip pure style nits that tflint/terraform fmt already
            catch. Post findings as a PR review comment.
          # No claude_args/--allowed-tools override: it REPLACES the action's default tool
          # set rather than extending it, which also strips the tool the action itself needs
          # to post the review comment — a prior "Bash(terraform:*),Bash(terragrunt:*)" value
          # here ran real turns (real cost) but posted nothing, 9 silent permission denials.
